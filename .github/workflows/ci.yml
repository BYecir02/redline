name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests backend (PHPUnit)
    runs-on: ubuntu-latest

    # Base PostgreSQL éphémère pour les tests fonctionnels.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: redline
          POSTGRES_PASSWORD: redline
          POSTGRES_DB: redline
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: redline-symfony

    env:
      DATABASE_URL: "postgresql://redline:redline@127.0.0.1:5432/redline?serverVersion=16&charset=utf8"
      # Clé JWT sans passphrase (générée à la volée ci-dessous).
      JWT_PASSPHRASE: ""

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql, intl, zip
          coverage: none

      - name: Installer les dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Générer la paire de clés JWT
        run: php bin/console lexik:jwt:generate-keypair --overwrite --no-interaction

      - name: Préparer la base de test
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Lancer les tests
        run: php bin/phpunit
