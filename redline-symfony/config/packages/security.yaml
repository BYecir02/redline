security:
    # Hachage automatique (bcrypt/argon2) pour tout utilisateur implémentant l'interface.
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Les utilisateurs sont chargés depuis la base, par email.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    # Seule la PREMIÈRE règle qui correspond s'applique.
    access_control:
        # Inscription et connexion accessibles sans jeton.
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        # Tout le reste de l'API exige un jeton JWT valide.
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Coût réduit en test pour accélérer (jamais en prod).
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
