server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy vers Symfony sur le réseau privé Docker.
    location /api/ {
        proxy_pass http://php:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les assets Vite sont fingerprintés et peuvent être mis en cache longtemps.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback requis pour les routes d'une Single Page Application.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

