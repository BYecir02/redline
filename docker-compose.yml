# Orchestration Redline - frontend React, backend Symfony, moteur Node et PostgreSQL.
#   Lancer :  docker compose up -d --build
#   Arrêter : docker compose down
services:
  database:
    image: postgres:16-alpine
    container_name: redline-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: redline
      POSTGRES_PASSWORD: redline
      POSTGRES_DB: redline
    # Port hôte 55433 pour ne pas entrer en conflit avec un autre PostgreSQL local.
    ports:
      - "55433:5432"
    volumes:
      - redline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redline -d redline"]
      interval: 5s
      timeout: 3s
      retries: 5

  php:
    build: ./redline-symfony
    container_name: redline-php
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./redline-symfony:/app
      # var/ (cache + logs) hors du montage Windows : évite les erreurs de
      # suppression de cache ("Directory not empty") côté Docker Desktop Windows.
      - /app/var
      # vendor/ dans un volume interne (système de fichiers rapide du conteneur) :
      # sinon PHP lit/stat des milliers de fichiers via le montage Windows lent
      # à chaque requête -> plusieurs secondes de latence. composer install (au
      # démarrage) remplit ce volume.
      - /app/vendor
    # DATABASE_URL injecté ici : Symfony s'y connecte via le réseau Docker
    # (hôte "database"). Le mot de passe est une valeur de dev, pas un secret prod.
    environment:
      DATABASE_URL: "postgresql://redline:redline@database:5432/redline?serverVersion=16&charset=utf8"
      # URL interne du moteur d'analyse Node (réseau Docker).
      ENGINE_URL: "http://engine:4000"
    depends_on:
      database:
        condition: service_healthy
      engine:
        condition: service_started

  # Moteur d'analyse (Node / ESLint) : service interne appelé par Symfony.
  # Aucune auth, aucune base - il ne fait qu'analyser du code et renvoyer un rapport.
  engine:
    build: ./redline-express
    container_name: redline-engine
    restart: unless-stopped
    ports:
      - "4000:4000"

  # Frontend React construit par Vite puis servi par Nginx. Les requêtes /api
  # sont transmises à Symfony sur le réseau Docker interne.
  frontend:
    build:
      context: ./redline
      args:
        VITE_API_URL: /api
    container_name: redline-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      php:
        condition: service_started

volumes:
  redline_pgdata:
